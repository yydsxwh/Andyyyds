<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>歪歪滴艾斯</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <img class="brand-logo" src="./mark.png" alt="歪歪滴艾斯" />
          <div class="brand-text">
            <strong>歪歪滴艾斯</strong>
            <span>WAIWAIDIAISI</span>
          </div>
        </div>

        <nav class="nav-block">
          <p class="nav-label">推荐</p>
          <button type="button" class="nav-item is-active" data-path="/">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
            </span>
            发现首页
          </button>
          <button type="button" class="nav-item" data-path="/courses">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H12v16H4.5A1.5 1.5 0 0 1 3 18.5v-13Zm9-.5h7.5A1.5 1.5 0 0 1 21 5.5v13a1.5 1.5 0 0 1-1.5 1.5H12V5Z"/></svg>
            </span>
            精选课程
          </button>
          <button type="button" class="nav-item" data-path="/shop">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 7V6a5 5 0 0 1 10 0v1h2.2a1 1 0 0 1 .98 1.2l-1.4 7A2 2 0 0 1 16.82 17H7.18a2 2 0 0 1-1.96-1.8l-1.4-7A1 1 0 0 1 4.8 7H7Zm2 0h6V6a3 3 0 0 0-6 0v1Z"/></svg>
            </span>
            商城
          </button>
          <button type="button" class="nav-item" data-path="/meetup">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6c0 4.5-6 12-6 12S6 13.5 6 9a6 6 0 0 1 6-6Zm0 8.2A2.2 2.2 0 1 0 12 6.8a2.2 2.2 0 0 0 0 4.4Z"/></svg>
            </span>
            约搭
          </button>
        </nav>

        <nav class="nav-block">
          <p class="nav-label">我的</p>
          <button type="button" class="nav-item" data-path="/learn">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 4h9a2 2 0 0 1 2 2v13l-4.5-2.5L7 19V6a2 2 0 0 0-2-2Zm12 1h2a2 2 0 0 1 2 2v12l-2-.9-2 .9V5Z"/></svg>
            </span>
            我的学习
          </button>
          <button type="button" class="nav-item" data-path="/messages">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H9l-4 4v-4.2A1.5 1.5 0 0 1 4 14.5v-9Z"/></svg>
            </span>
            消息
          </button>
          <button type="button" class="nav-item" data-path="/orders">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 3h10l1 4H6l1-4Zm-1 6h12l-1.2 10.2A2 2 0 0 1 14.81 21H9.19a2 2 0 0 1-1.99-1.8L6 9Z"/></svg>
            </span>
            订单
          </button>
          <button type="button" class="nav-item" data-path="/account">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.2 0-8 2.1-8 5v1h16v-1c0-2.9-3.8-5-8-5Z"/></svg>
            </span>
            账户
          </button>
          <button type="button" class="nav-item" data-path="/studio">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11ZM8 8v8h2V8H8Zm3 3v5h2v-5h-2Zm3-2v7h2V9h-2Z"/></svg>
            </span>
            工作室
          </button>
        </nav>

        <div class="sidebar-foot">
          <p>官网同源 · 完整功能</p>
        </div>
      </aside>

      <header class="titlebar">
        <div class="traffic">
          <button type="button" class="icon-btn" id="btn-back" title="后退" aria-label="后退">
            <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-forward" title="前进" aria-label="前进">
            <svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-reload" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <form class="search" id="search-form" autocomplete="off">
          <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M16.2 16.2 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="搜索课程、专栏…"
            maxlength="80"
          />
        </form>

        <div class="title-spacer" aria-hidden="true"></div>

        <div class="win-controls">
          <button type="button" class="win-btn" id="btn-min" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="win-btn" id="btn-max" title="最大化" aria-label="最大化">
            <svg id="ico-max" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <svg id="ico-restore" class="is-hidden" viewBox="0 0 12 12"><path d="M3.5 4.2h4.3V8.5H3.5V4.2Zm1.2-1.3h4.6v4.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button type="button" class="win-btn win-close" id="btn-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="content-frame" aria-hidden="true">
        <div class="loading-bar" id="loading-bar"></div>
      </div>

      <footer class="footerbar">
        <div class="footer-left">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span id="page-title">歪歪滴艾斯</span>
        </div>
        <div class="footer-right">
          <button type="button" class="text-btn" id="btn-browser">在浏览器打开</button>
          <span class="muted" id="page-url">www.yydsxwh.com</span>
        </div>
      </footer>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
