name: Integrate decorate package

on:
  push:
    branches:
      - Andyyyds20260901independentpackage

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'chore: integrate decorate package from PR #19' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Andyyyds20260901independentpackage

      - name: Merge decorate PR with PR changes preferred on conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cursor/decorate-package-14ec
          git merge --no-ff -X theirs origin/cursor/decorate-package-14ec -m "chore: integrate decorate package from PR #19"
          git push origin HEAD:Andyyyds20260901independentpackage
